services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hostel
      POSTGRES_PASSWORD: hostel_local
      POSTGRES_DB: hostel_khata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hostel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostel -d hostel_khata"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  hostel_postgres:
